  main_prompt_sequence:
    - image_content
    - building_composition
    - spatial_hierarchy
    - architectural_objects
    - rendering_quality_and_visualization_style
  quality_intensifier: "超级写实，高级的建筑渲染图，高分辨率，高度详细，清晰对焦，8k resolution，masterpiece，intricate details，photorealistic，detailed texture"
  unresolved_fields: []
  final_prompt: null

negative_constraints:
